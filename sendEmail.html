<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/sedEmail.css">
    <link rel="shortcut icon" href="/assets/logos/favicon_bota_fora.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap"
      rel="stylesheet">
    <title>Email send</title>
  </head>
  <body>

    <div class="sendEmail-container">
      <div class="form-instructions">
        <img src="./assets/logos/logo_yard_sale.svg" alt="/" class="logo">
        <h1 class="title">Email has been sent!</h1>
        <p class="instructions">Please check your inbox for instructions on
          how
          to reset the password</p>

        <img src="./assets/icons/email.svg" alt="/" class="logoSendEmail">

        <form class="buttonLogin" action="#">
          <input type="submit" value="Login" class="buttonConfirm">
        </form>

        <p class="instructions-before">Didn't receive the email? <span> <a
              class="resend" href="#">Resend</a></span></p>
      </div>

    </div>

  </body>
</html>
