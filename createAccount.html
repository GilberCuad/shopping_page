<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="shortcut icon" href="/assets/logos/favicon_bota_fora.svg"
      type="img">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap"
      rel="stylesheet">
    <title>Create password</title>
  </head>
  <body>
    <div class="login">
      <div class="form-container">
        <img src="./assets/logos/logo_yard_sale.svg" alt="/" class="logo">
        <h1 class="myAccounTittle">My account</h1>

        <form action="/" class="form-main">
          <label for="name" class="label">Name</label>
          <input type="text" class="input input-text" id="name"
            placeholder="Name user">

          <label for="new-email" class="label">Email</label>
          <input type="email" class="input input-email" id="new-email"
            placeholder="cuadrado@example.com">

          <label for="new-password" class="label">Password</label>
          <input type="password" class="input input-password" id="new-password"
            placeholder="********">

          <input type="submit" value="Create"
            class="primary-button login-button">

        </form>
      </div>
    </div>
  </body>
