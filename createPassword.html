<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/createPassword.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="/assets/logos/favicon_bota_fora.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap"
      rel="stylesheet">
    <title>Create password</title>
  </head>
  <body>
    <div class="login">
      <div class="form-container">
        <img src="./assets/logos/logo_yard_sale.svg" alt="/" class="logo">
        <h1 class="title-main">Create a new password</h1>
        <p class="subtitle">Enter a new password for your account</p>

        <form action="/" class="form-main">
          <label for="password" class="label">Password</label>
          <input type="password" class="input input-password" id="password"
            placeholder="********">

          <label for="new-password" class="label">Re-enter password</label>
          <input type="password" class="input input-password" id="new-password"
            placeholder="********">

          <input type="submit" value="Confirm"
            class="primary-button login-button">
        </form>
      </div>
    </div>
  </body>
</html>
